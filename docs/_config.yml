title: Lore Office
description: The office suite on Quench - docs, sheets, notes and pdf in the browser, with an optional cloud
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "guides"
    values:
      render_with_liquid: false
  - scope:
      path: "apps"
    values:
