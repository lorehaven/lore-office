openapi: 3.1.0
info:
  title: Lore Office cloud API
  version: 0.1.1
  description: >
    The cloud of the Lore Office suite: each signed-in person's documents (docs, sheets, notes, pdf) and share links.
    Served by lore-office-server under its base path (`/lore-office` in the estate). Calls act on the signed-in person's own
    documents; only `/api/s/{token}` is open, to whoever holds the token.
servers:
  - url: "{base}"
    variables:
      base:
        default: /lore-office
tags:
  - name: status
  - name: documents
  - name: links
  - name: folders
  - name: log
  - name: people
  - name: service
paths:
  /api/status:
    get:
      tags: [status]
      summary: Who is signed in and where signing in starts
      security: []
      responses:
        "200":
          description: The person (null when nobody is accepted) and the sign-in address.
          content:
            application/json:
              schema:
                type: object
                required: [user, login]
                properties:
                  user: { type: [string, "null"] }
                  login: { type: string }
              example: { user: ada, login: /lore-office/ui/login }
  /api/usage:
    get:
      tags: [status]
      summary: Space used and allowed
      security: [{ session: [] }]
      responses:
        "200":
          description: Bytes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
        "401": { $ref: "#/components/responses/SignIn" }
  /api/docs:
    get:
      tags: [documents]
      summary: List the person's documents, newest first
      security: [{ session: [] }]
      parameters:
        - name: kind
          in: query
          description: Only documents of this app; empty or absent lists all.
          schema: { $ref: "#/components/schemas/Kind" }
      responses:
        "200":
          description: The documents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocMeta" }
        "401": { $ref: "#/components/responses/SignIn" }
    put:
      tags: [documents]
      summary: Make a document from the body
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/Name" }
        - { $ref: "#/components/parameters/KindRequired" }
        - { name: folder, in: query, description: The folder to make it in (the top when absent)., schema: { type: string } }
      requestBody: { $ref: "#/components/requestBodies/File" }
      responses:
        "200":
          description: The new document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "507": { $ref: "#/components/responses/NoRoom" }
  /api/docs/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [documents]
      summary: The bytes of a document
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/File" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [documents]
      summary: Replace a document
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/Name" }
        - { $ref: "#/components/parameters/KindRequired" }
        - { $ref: "#/components/parameters/IfMatch" }
        - { name: at, in: query, description: The version of the change log the file is the document at (a page that applied every change sends it); refused with 409 and the latest number when changes were added since., schema: { type: integer, minimum: 0 } }
      requestBody: { $ref: "#/components/requestBodies/File" }
      responses:
        "200":
          description: The document as it is now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "507": { $ref: "#/components/responses/NoRoom" }
    delete:
      tags: [documents]
      summary: Delete a document and its links
      security: [{ session: [] }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/docs/{id}/ops:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [log]
      summary: The changes after a number
      security: [{ session: [] }]
      parameters:
        - { name: after, in: query, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: The changes, oldest first, with the latest number and the stored file's version.
          content:
            application/json:
              schema:
                type: object
                required: [head, version, ops]
                properties:
                  head: { type: integer }
                  version: { type: integer }
                  ops:
                    type: array
                    items:
                      type: object
                      required: [n, op]
                      properties:
                        n: { type: integer }
                        op: { description: The change as it was sent. }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: "The changes it needs were folded into the stored file: fetch the file."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogNumbers" }
    post:
      tags: [log]
      summary: Add a change
      security: [{ session: [] }]
      parameters:
        - { name: base, in: query, required: true, description: The latest number the sender knew., schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { description: A change the app reads back (for sheets, the cells written). }
      responses:
        "200":
          description: Added; its number.
          content:
            application/json:
              schema:
                type: object
                required: [n]
                properties:
                  n: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`base` is not the latest number; this is."
          content:
            application/json:
              schema: { type: object, required: [head], properties: { head: { type: integer } } }
  /api/s/{token}/ops:
    parameters:
      - { $ref: "#/components/parameters/Token" }
    get:
      tags: [log]
      summary: The changes after a number, through a link
      security: []
      parameters:
        - { name: after, in: query, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: As for the person's own document. }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { description: Fetch the file. }
    post:
      tags: [log]
      summary: Add a change, through an edit link
      security: []
      parameters:
        - { name: base, in: query, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: Added. }
        "403": { description: The link only lets people view. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Not the latest number. }
  /api/shared/{owner}/{id}/ops:
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [log]
      summary: The changes after a number, for a document shared with the person
      security: [{ session: [] }]
      parameters:
        - { name: after, in: query, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: As for the person's own document. }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { description: Fetch the file. }
    post:
      tags: [log]
      summary: Add a change, with an edit share
      security: [{ session: [] }]
      parameters:
        - { name: base, in: query, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: Added. }
        "403": { description: The share only lets the person view. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Not the latest number. }
  /api/docs/{id}/presence:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [log]
      summary: This page is here, at this place
      description: Also available as `/api/s/{token}/presence` (through a link) and `/api/shared/{owner}/{id}/presence` (shared with a person). In memory only.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client]
              properties:
                client: { type: string, description: Tells this page from the others. }
                name: { type: string, maxLength: 24 }
                color: { type: string, description: "#rgb or #rrggbb" }
                pos: { type: string, description: Where it is, as its app wrote it. }
                gone: { type: boolean, description: The page left. }
      responses:
        "200":
          description: The room's number.
          content:
            application/json:
              schema:
                type: object
                required: [rev]
                properties:
                  rev: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [log]
      summary: The others here, held until something changes
      security: [{ session: [] }]
      parameters:
        - { name: client, in: query, required: true, schema: { type: string } }
        - { name: seen, in: query, required: true, description: The room's number the page has., schema: { type: integer, minimum: 0 } }
        - { name: wait, in: query, description: How long to hold it at most, in milliseconds (up to 25000)., schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: The room's number, how many times the document itself changed, and the other pages.
          content:
            application/json:
              schema:
                type: object
                required: [rev, doc, peers]
                properties:
                  rev: { type: integer }
                  doc: { type: integer }
                  peers:
                    type: array
                    items:
                      type: object
                      properties:
                        client: { type: string }
                        name: { type: string }
                        color: { type: string }
                        pos: { type: string }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/docs/{id}/meta:
    get:
      tags: [documents]
      summary: A document without its bytes
      description: What a page asks every few seconds to see whether someone else saved the document.
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: The document's description.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocMeta" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/folders:
    get:
      tags: [folders]
      summary: Every folder the person has
      security: [{ session: [] }]
      responses:
        "200":
          description: Paths, sorted, with the folders above each.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
              example: ["Work", "Work/2026"]
        "401": { $ref: "#/components/responses/SignIn" }
    post:
      tags: [folders]
      summary: Make a folder (and those above it)
      security: [{ session: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The folders now.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
    delete:
      tags: [folders]
      summary: Take away an empty folder
      security: [{ session: [] }]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed. }
        "400": { description: Not a folder path, or not empty. }
        "401": { $ref: "#/components/responses/SignIn" }
  /api/docs/{id}/move:
    put:
      tags: [folders]
      summary: Put a document in a folder
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: folder, in: query, description: The folder; empty is the top., schema: { type: string } }
      responses:
        "200":
          description: The document as it is now (its bytes and etag are as they were).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/docs/{id}/grant:
    post:
      tags: [people]
      summary: Share a document with a named person
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: user, in: query, required: true, schema: { type: string } }
        - { name: rights, in: query, schema: { type: string, enum: [view, edit], default: view } }
      responses:
        "200":
          description: The grant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [people]
      summary: Stop sharing a document with a person
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: user, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Taken back. }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/docs/{id}/grants:
    get:
      tags: [people]
      summary: Who the document is shared with
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: The grants.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Grant" } }
        "401": { $ref: "#/components/responses/SignIn" }
  /api/grants:
    get:
      tags: [people]
      summary: What others shared with the signed-in person
      security: [{ session: [] }]
      responses:
        "200":
          description: The grants, newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Grant" } }
        "401": { $ref: "#/components/responses/SignIn" }
  /api/shared/{owner}/{id}:
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [people]
      summary: Open a document another person shared
      security: [{ session: [] }]
      responses:
        "200":
          description: The bytes; `x-rights` says what the grant allows.
          headers:
            x-rights: { schema: { type: string, enum: [view, edit] } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [people]
      summary: Save a document another person shared with edit rights
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody: { $ref: "#/components/requestBodies/File" }
      responses:
        "200":
          description: The document as it is now (in the owner's cloud).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocMeta" }
        "403": { description: The grant only lets the person view. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "507": { $ref: "#/components/responses/NoRoom" }
  /api/shared/{owner}/{id}/meta:
    get:
      tags: [people]
      summary: The description of a shared document, without its bytes
      security: [{ session: [] }]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: The description; `x-rights` says what the grant allows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocMeta" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/docs/{id}/share:
    post:
      tags: [links]
      summary: Make a link to a document
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: rights
          in: query
          schema: { type: string, enum: [view, edit], default: view }
        - name: days
          in: query
          description: A positive number of days after which the link ends; otherwise it never does.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The link.
          headers:
            x-link:
              description: The address that opens it, `<scheme>://<host><base>/<app>?share=<token>`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Share" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/shares:
    get:
      tags: [links]
      summary: The person's links, newest first
      security: [{ session: [] }]
      responses:
        "200":
          description: The links.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Share" }
        "401": { $ref: "#/components/responses/SignIn" }
  /api/shares/{token}:
    delete:
      tags: [links]
      summary: Withdraw a link
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/Token" }
      responses:
        "204": { description: Withdrawn. }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/s/{token}:
    parameters:
      - { $ref: "#/components/parameters/Token" }
    get:
      tags: [links]
      summary: Open the document of a link
      security: []
      responses:
        "200":
          description: The bytes; `x-rights` says what the link allows.
          headers:
            x-rights: { schema: { type: string, enum: [view, edit] } }
            x-name: { schema: { type: string } }
            x-kind: { schema: { $ref: "#/components/schemas/Kind" } }
            x-etag: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [links]
      summary: Save through an edit link
      security: []
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody: { $ref: "#/components/requestBodies/File" }
      responses:
        "200":
          description: The document as it is now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocMeta" }
        "403":
          description: The link only lets people view.
          content:
            text/plain:
              example: this link only lets you view
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "507": { $ref: "#/components/responses/NoRoom" }
  /api/s/{token}/meta:
    get:
      tags: [links]
      summary: The description of a link's document, without its bytes
      security: []
      parameters:
        - { $ref: "#/components/parameters/Token" }
      responses:
        "200":
          description: The document's description; `x-rights` says what the link allows.
          headers:
            x-rights: { schema: { type: string, enum: [view, edit] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocMeta" }
        "404": { $ref: "#/components/responses/NotFound" }
  /health:
    get:
      tags: [service]
      summary: The service is up (also `/health/{anything}`)
      security: []
      responses:
        "200":
          description: ok
          content:
            text/plain:
              example: ok
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: forge_session
      description: Gatehouse's access token, set by the sign-in routes (the name follows `AUTH_COOKIE_NAME`).
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: A document's id (hexadecimal).
      schema: { type: string, pattern: "^[0-9a-f]{1,64}$" }
    Token:
      name: token
      in: path
      required: true
      description: A link's token (64 hexadecimal characters).
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    Name:
      name: name
      in: query
      required: true
      description: The document's name (not empty, at most 200 bytes).
      schema: { type: string }
    KindRequired:
      name: kind
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Kind" }
    IfMatch:
      name: If-Match
      in: header
      description: The etag the save began from; a different current etag answers 409.
      schema: { type: string }
  requestBodies:
    File:
      required: true
      description: The file, at most `MAX_UPLOAD_BYTES`.
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
  responses:
    File:
      description: The bytes.
      headers:
        x-name: { description: The name, percent-encoded., schema: { type: string } }
        x-kind: { schema: { $ref: "#/components/schemas/Kind" } }
        x-etag: { schema: { type: string } }
        cache-control: { schema: { type: string, const: no-store } }
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    SignIn:
      description: Not signed in, or not accepted. Body `sign in first`.
      headers:
        www-authenticate: { schema: { type: string, const: Bearer } }
    BadRequest:
      description: Something missing or invalid (`name and kind are needed`, `rights are view or edit`, ...).
    NotFound:
      description: No such document, link or call.
    Conflict:
      description: The document changed since the etag the save began from.
      headers:
        x-etag: { description: The current etag., schema: { type: string } }
    TooLarge:
      description: The body is over `MAX_UPLOAD_BYTES`.
    NoRoom:
      description: The person's quota is used up.
  schemas:
    Kind:
      type: string
      enum: [docs, sheets, notes, pdf]
    DocMeta:
      type: object
      required: [id, name, kind, size, modified, etag]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/Kind" }
        size: { type: integer, format: int64, description: Bytes. }
        modified: { type: integer, format: int64, description: Seconds since 1970. }
        etag: { type: string }
        folder: { type: string, description: "The folder it is in; empty for the top." }
        version: { type: integer, description: "The version of the change log the stored file stands for; 0 when there is none." }
    LogNumbers:
      type: object
      required: [head, version]
      properties:
        head: { type: integer, description: The latest change number. }
        version: { type: integer, description: The version of the stored file. }
    Grant:
      type: object
      required: [owner, doc, with, name, kind, rights, created]
      properties:
        owner: { type: string }
        doc: { type: string }
        with: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/Kind" }
