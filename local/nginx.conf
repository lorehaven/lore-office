# One address for the local estate, with the services under the paths they have in the cluster (see foreman.toml).
# Plain HTTP on this machine only: browsers accept the realm's Secure cookies from localhost.
server {
    listen 127.0.0.1:8080;

    # Larger than the largest file a save may send.
    client_max_body_size 300m;
    # A page keeps one question open for up to 25 s to be told of changes.
    proxy_read_timeout 90s;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    location = / { return 302 /lore-office/; }
    location /gatehouse { proxy_pass http://127.0.0.1:5443; }
    location /warehouse { proxy_pass http://127.0.0.1:6443; }
    location /lore-office { proxy_pass http://127.0.0.1:3000; }
    # lore-office's scripts and styles, which pages ask for outside its path (the cluster's ingress routes them too).
    location /_quench/ { proxy_pass http://127.0.0.1:3000; }
}
