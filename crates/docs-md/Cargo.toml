[package]
name = "docs-md"
autotests = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# Markdown <-> docs-text: headings, lists, bold, italic, strikethrough, code, links and pipe tables. Pictures are written as
# their alt text and not read back.
[lib]
name = "docs_md"
path = "src/lib.rs"

[dependencies]
docs-text = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }

[lints]
workspace = true
