[package]
name = "sheets-xls"
autotests = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# Reads the old Excel format (.xls, BIFF8 in an OLE2 container): sheets, values (what formulas came to), dates and number
# formats, column widths and merged cells. It does not write it: save as .xlsx or .ods.
[lib]
name = "sheets_xls"
path = "src/lib.rs"

[dependencies]
sheets-model = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }

[lints]
workspace = true
