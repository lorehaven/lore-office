[package]
name = "pdf-write"
autotests = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# Writes PDF files: pages with text in the standard fonts, pictures, links, filled rectangles and lines. Text the standard fonts lack goes in an embedded Noto Sans; the standard fonts are not embedded (the viewer
# draws Helvetica, Times and Courier itself), so text is limited to what WinAnsi covers. Shared by the lore apps' export.
[lib]
name = "pdf_write"
path = "src/lib.rs"

[dependencies]
quench-archive = { workspace = true }
quench-text = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }
quench-pdf = { registry = "ennor", version = "0.1" }

[lints]
workspace = true
