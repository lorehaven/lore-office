[package]
name = "office-i18n"
autotests = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# The catalogues of an app's languages and the way its labels are looked up: written in English in the code, found by an id
# made from the English text, shown in English when a language has no entry. Fluent files, read by quench-ui's catalogue.
[lib]
name = "office_i18n"
path = "src/lib.rs"

[dependencies]
quench-ui = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }

[lints]
workspace = true
