[package]
name = "office-cloud-ui"
autotests = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# The cloud as an app sees it, host independent: sign in, the documents kept for you, saving and opening them, and share links.
# The app gives a `Binding` (what it saves and how it opens a file) and a `Transport` (how a request reaches the server; the
# browser's is in `web`); the File menu gets `menu_items()` and the screen `overlay()`.
[lib]
name = "office_cloud_ui"
path = "src/lib.rs"

[dependencies]
office-cloud = { workspace = true }
office-ui = { workspace = true }
quench-serde = { workspace = true }
quench-ui = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
quench-ui-web = { workspace = true }

[[test]]
name = "screens"
path = "tests/screens.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }

[lints]
workspace = true
