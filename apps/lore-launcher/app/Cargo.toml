[package]
name = "lore-launcher-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "lore_launcher_app"
path = "src/lib.rs"
# `cdylib` is the module the browser loads; `rlib` is what the server renders pages from.
crate-type = ["cdylib", "rlib"]

[dependencies]
office-i18n = { workspace = true }
office-theme = { workspace = true }
office-ui = { workspace = true }
office-cloud-ui = { workspace = true }
quench-serde = { workspace = true }
quench-ui = { workspace = true }
quench-ui-web = { workspace = true }

[lints]
workspace = true

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
office-i18n = { workspace = true }
quench-test = { workspace = true }
